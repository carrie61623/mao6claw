<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貓六爪｜管理後台・首頁內容設定</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1024;color:#f5f7ff;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{width:min(900px,92%);margin:auto}.top{padding:28px 0;border-bottom:1px solid #2b365a}
h1{margin:0;font-size:28px}.sub{color:#929dbd;margin-top:6px}.panel{margin:24px 0;padding:26px;border:1px solid #354064;border-radius:20px;background:#121936}
h2{margin-top:0;font-size:21px}.field{margin:18px 0}.field label{display:block;font-weight:800;margin-bottom:7px}
input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #3a476d;background:#0d1430;color:#fff;font-size:15px;font-family:inherit}textarea{min-height:100px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.btn{padding:13px 20px;border:0;border-radius:10px;background:linear-gradient(135deg,#7447ff,#ff4fbe);color:#fff;font-weight:900;cursor:pointer}
.btn.secondary{background:#1a2343;border:1px solid #3a476d}.status{margin-left:12px;color:#63e7ff}
#editor{display:none}.login{max-width:460px;margin:70px auto}.error{color:#ff78bf;margin-top:10px;white-space:pre-wrap}.preview{margin-top:22px;padding:20px;border-radius:16px;background:#171e3b}.preview h3{font-size:30px;margin:8px 0}.preview p{color:#aeb7d1}.address{color:#cbd3e7}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.small{font-size:12px;color:#7e89aa}
@media(max-width:650px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="topbar"><div><h1>⚙️ 貓六爪網站設定</h1><div class="sub">首頁文字與基本資訊｜真連線版</div></div><button id="logoutBtn" class="btn secondary" style="display:none" onclick="logoutAdmin()">登出</button></div></div>

<div id="login" class="panel login">
<h2>🔐 管理員登入</h2>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="管理員 Email"></div>
<div class="field"><label>密碼</label><input id="password" type="password" placeholder="密碼"></div>
<button class="btn" onclick="loginAdmin()">登入</button>
<div id="loginError" class="error"></div>
</div>

<div id="editor">
<div class="panel"><h2>🏠 首頁主視覺</h2>
<div class="field"><label>主標題</label><input id="hero_title"></div>
<div class="field"><label>副標題</label><textarea id="hero_subtitle"></textarea></div></div>

<div class="panel"><h2>🎯 首頁介紹</h2><div class="grid">
<div class="field"><label>區塊標題</label><input id="intro_title"></div>
<div class="field"><label>區塊副標</label><input id="intro_subtitle"></div></div></div>

<div class="panel"><h2>🏪 台主招募</h2>
<div class="field"><label>招募標題</label><input id="owner_title"></div>
<div class="field"><label>招募內容</label><textarea id="owner_text"></textarea></div>
<div class="field"><label>招募標語</label><input id="owner_tagline"></div></div>

<div class="panel"><h2>📍 店家資訊</h2>
<div class="field"><label>店家名稱</label><input id="store_name"></div>
<div class="field"><label>店家地址</label><input id="address"></div>
<div class="grid">
<div class="field"><label>群組 LINE｜對應前台「找到貓六爪－玩家群」</label><input id="line_url" placeholder="貼上玩家群組連結"></div>
<div class="field"><label>場主 LINE｜對應前台「了解合作方式」</label><input id="owner_line_url" placeholder="貼上場主／官方好友連結"></div>
<div class="field"><label>Facebook 連結</label><input id="facebook_url" placeholder="之後填入"></div>
</div></div>

<div class="panel">
<button class="btn" onclick="save()">💾 儲存首頁設定</button><span id="status" class="status"></span>
<div class="preview"><b>即時預覽</b><h3 id="pvTitle"></h3><p id="pvSub"></p><div class="address">📍 <span id="pvAddress"></span></div></div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://qxbagchxhmstznkorcgk.supabase.co";
const SUPABASE_KEY="sb_publishable_I7P-WhRTV2js0zbxf8Tfkg_rYjWf4oZ";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const loginPanel=$("login"), editorPanel=$("editor"), loginError=$("loginError");
const statusEl=$("status"), emailEl=$("email"), passwordEl=$("password"), logoutBtn=$("logoutBtn");
const ids=["hero_title","hero_subtitle","intro_title","intro_subtitle","owner_title","owner_text","owner_tagline","store_name","address","line_url","owner_line_url","facebook_url"];

function preview(){
  $("pvTitle").textContent=$("hero_title").value||"";
  $("pvSub").textContent=$("hero_subtitle").value||"";
  $("pvAddress").textContent=$("address").value||"";
}
ids.forEach(id=>$(id).addEventListener("input",preview));

async function loginAdmin(){
  loginError.textContent="";
  statusEl.textContent="";
  if(!emailEl.value || !passwordEl.value){
    loginError.textContent="請輸入 Email 與密碼";
    return;
  }
  const {error}=await client.auth.signInWithPassword({
    email:emailEl.value.trim(),
    password:passwordEl.value
  });
  if(error){
    loginError.textContent="登入失敗："+error.message;
    return;
  }
  await initEditor();
}

async function initEditor(){
  const {data,error}=await client.auth.getSession();
  if(error){
    loginError.textContent="無法確認登入狀態："+error.message;
    return;
  }
  if(!data.session){
    loginPanel.style.display="block";
    editorPanel.style.display="none";
    logoutBtn.style.display="none";
    return;
  }

  loginPanel.style.display="none";
  editorPanel.style.display="block";
  logoutBtn.style.display="inline-flex";

  const result=await client.from("site_settings").select("*").limit(1).maybeSingle();
  if(result.error){
    statusEl.textContent="讀取失敗："+result.error.message;
    return;
  }
  if(!result.data){
    statusEl.textContent="找不到網站設定資料";
    return;
  }

  ids.forEach(id=>$(id).value=result.data[id]??"");
  preview();
}

async function save(){
  statusEl.textContent="儲存中…";
  const values={};
  ids.forEach(id=>values[id]=$(id).value);
  values.updated_at=new Date().toISOString();

  const row=await client.from("site_settings").select("id").limit(1).maybeSingle();
  if(row.error){
    statusEl.textContent="讀取設定失敗："+row.error.message;
    return;
  }
  if(!row.data){
    statusEl.textContent="找不到 site_settings 資料列";
    return;
  }

  const result=await client.from("site_settings").update(values).eq("id",row.data.id);
  if(result.error){
    statusEl.textContent="儲存失敗："+result.error.message;
    return;
  }
  statusEl.textContent="✓ 已儲存到 Supabase";
}


async function saveBattle(){
  $("battleSaveStatus").textContent="儲存中…";
  const row=await client.from("site_settings").select("id").limit(1).maybeSingle();
  if(row.error||!row.data){$("battleSaveStatus").textContent="找不到 site_settings 資料列";return;}
  const values={
    battle_active:$("battle_active").checked,
    battle_title:$("battle_title").value.trim(),
    battle_date:$("battle_date").value||null,
    battle_time:$("battle_time").value.trim(),
    battle_content:$("battle_content").value.trim(),
    battle_rules:$("battle_rules").value.trim(),
    battle_image_url:$("battle_image_url").value.trim(),
    battle_registration_url:$("battle_registration_url").value.trim(),
    updated_at:new Date().toISOString()
  };
  const {error}=await client.from("site_settings").update(values).eq("id",row.data.id);
  $("battleSaveStatus").textContent=error?"儲存失敗："+error.message:"✓ 已儲存到 Supabase";
}

async function logoutAdmin(){
  await client.auth.signOut();
  location.reload();
}

window.addEventListener("load",initEditor);
client.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT") location.reload();
});
</script>
</body>
</html>
